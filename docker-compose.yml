# 내부망(Linux) 서버용 — 소스 루트에 두고 `docker compose up -d --build`
# (reflex-base:1.0.0 이미지를 먼저 docker load 해 둘 것. 빌드는 인터넷 없이 진행됨)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reflex-app:latest
    pull_policy: never               # 내부망: 레지스트리에서 받으려 하지 않음
    container_name: reflex-app
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"    # 포트 변경은 .env 의 PUBLIC_PORT=9000 처럼 (재빌드 불필요)
    env_file:
      - .env                         # OpenAI/Qdrant 등 비밀값 (없으면 빈 파일이라도 만들 것)
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
      REFLEX_UPLOADED_FILES_DIR: /app/uploaded_files
      # SQLite를 쓸 경우 볼륨 안에 두기 (rxconfig.py 의 db_url 보다 우선)
      # REFLEX_DB_URL: sqlite:////app/data/reflex.db
    volumes:
      - ./volumes/uploaded_files:/app/uploaded_files
      - ./volumes/data:/app/data

  # 내부망에 Qdrant도 같이 띄울 경우 주석 해제
  # (외부망에서 docker pull qdrant/qdrant:<버전> 후 이 이미지도 docker save 로 함께 반입)
  # qdrant:
  #   image: qdrant/qdrant:v1.15.0
  #   container_name: qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - ./volumes/qdrant:/qdrant/storage
  #   # 이 경우 앱의 Qdrant 주소는 http://qdrant:6333
