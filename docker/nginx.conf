map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /srv;
    # /documents → /documents/ 리다이렉트 시 컨테이너 내부 포트(80)가 아닌
    # 브라우저가 접속한 주소(:8080)를 유지하도록 상대 경로로 리다이렉트
    absolute_redirect off;
    client_max_body_size 500m;   # rx.upload 업로드 용량 상한 (필요시 조정)

    # Reflex 백엔드 경로 → 컨테이너 내부 백엔드(8000)
    #   _event  : 상태 동기화 웹소켓
    #   _upload : rx.upload 업로드/다운로드
    #   ping, _health, _all_routes : 헬스체크/라우팅
    # FastAPI로 직접 만든 엔드포인트가 있으면 그 경로 prefix(예: api)도 여기에 추가하세요.
    location ~ ^/(_event|_upload|ping|_health|_all_routes)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # export 된 정적 프런트엔드
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
